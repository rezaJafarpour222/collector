[package]
name = "Collector"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "cookies", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = "0.4"
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["default-https-client", "behavior-version-latest", "rt-tokio"] }
zstd = "0.13"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
