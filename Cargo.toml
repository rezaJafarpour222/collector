[package]
name = "Collector"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dotenvy = "0.15.7"
chrono = "0.4.45"
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["default-https-client", "behavior-version-latest", "rt-tokio"] }
zstd = "0.14.3"
futures = "0.3.34"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
